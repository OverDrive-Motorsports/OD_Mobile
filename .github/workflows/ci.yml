name: CI

on:
  push:
  pull_request:

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  build_android:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: overdrive
        run: flutter pub get

      - name: Prepare env file
        working-directory: overdrive
        run: cp .env.example .env

      - name: Build debug APK
        working-directory: overdrive
        run: flutter build apk --debug

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [build_android]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: overdrive
        run: flutter pub get

      - name: Prepare env file
        working-directory: overdrive
        run: cp .env.example .env

      - name: Run tests
        working-directory: overdrive
        run: flutter test lib/test

  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: overdrive
        run: flutter pub get

      - name: Prepare env file
        working-directory: overdrive
        run: cp .env.example .env

      - name: Check formatting
        working-directory: overdrive
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        working-directory: overdrive
        run: flutter analyze

  secret_scan:
    name: Secret scan
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
